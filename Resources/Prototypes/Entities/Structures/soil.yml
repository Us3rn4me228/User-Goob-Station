# SPDX-License-Identifier: MIT
- type: entity
  id: BaseSoil
  abstract: true
  name: soil-name
  description: soil-desc
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: false
        mask:
        - FullTileMask
        layer:
        - FullTileMask
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Transform
    anchored: true

- type: entity
  parent: BaseSoil
  id: hydroponicsSoil
  name: soil-name
  description: soil-desc
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: soil
    noRot: true
  - type: PlantHolder
    drawWarnings: false
  - type: SolutionContainerManager
    solutions:
      soil:
        maxVol: 200
  - type: RefillableSolution
    solution: soil
    maxRefill: 50
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: soil
  - type: Appearance
  - type: PlantHolderVisuals

- type: entity
  parent: hydroponicsSoil
  id: FungalSoil
  name: fungal-soil-name
  description: soil-desc
  components:
  - type: Construction
    graph: Soil
    node: fungalSoil
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: fungal_soil
    noRot: true
  - type: PlantHolder
    waterLevel: 0
    nutritionLevel: 0

##TO-DO: place it into proper folder later
- type: entity
  parent: BaseItem
  id: ClumpSoil
  name: clump-soil-name
  description: clump-soil-desc
  components:
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: soilclump
  - type: SpawnAfterInteract
    prototype: PileSoil
    doAfter: 1
    removeOnInteract: true
  - type: Tag
    tags:
    - SoilClump

- type: entity
  parent: BaseSoil
  id: PileSoil
  name: pile-soil-name
  description: pile-soil-desc
  components:
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: soilpile
    noRot: true
  - type: Construction
    graph: SoilPile
    node: start

- type: constructionGraph
  id: SoilPile
  start: start
  graph:
  - node: start
    entity: PileSoil
    edges:
    - to: pileSoil
      steps:
      - tag: SoilClump
        doAfter: 2
      - tag: SoilClump
        doAfter: 2
      completed:
      - !type:SnapToGrid
        southRotation: true
    - to: done
      steps:
      - tag: SoilClump
        doAfter: 2
      completed:
      - !type:SpawnPrototype
        prototype: hydroponicsSoil
      - !type:DeleteEntity {}
  - node: pileSoil
    entity: PileSoil
  - node: done
