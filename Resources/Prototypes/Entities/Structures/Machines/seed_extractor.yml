- type: entity
  id: SeedExtractor
  name: seed extractor
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  description: Extracts seeds from produce.
  components:
  - type: Sprite
    sprite: Structures/Machines/seed_extractor.rsi
    snapCardinals: true
    layers:
    - state: seedextractor-off
    - state: seedextractor-unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: SeedExtractor
  - type: Machine
    board: SeedExtractorMachineCircuitboard

### Place somewere else later

- type: entity
  id: SeedTable
  name: seed table
  parent: BaseStructure
  description: Extracts seeds from produce.
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Specific/seedtable.rsi
    state: seedtable
    snapCardinals: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ContainerContainer
    containers:
      seeds: !type:Container
  - type: SeedPress
    insertSound:
      path: /Audio/Effects/woodenclosetopen.ogg
    extractSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: Construction
    graph: SeedGraph
    node: SeedTableNode

- type: construction
  id: SeedTable
  graph: SeedGraph
  targetNode: SeedTableNode
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

- type: constructionGraph
  id: SeedGraph
  graph:
  - node: start
    edges:
    - to: SeedTableNode
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: WoodPlank
        amount: 5
        doAfter: 1
      - material: FloorTileGrass
        amount: 3
        doAfter: 1
  - node: SeedTableNode
    entity: SeedTable
