- type: entity
  name: ent-HydroponicsToolMiniHoe
  parent: BaseItem
  id: HydroponicsToolMiniHoe
  description: ent-HydroponicsToolMiniHoe.desc
  components:
  - type: Tag
    tags:
    - Hoe
    - BotanyHoe
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hoe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 6
  - type: Item
    sprite: Objects/Tools/Hydroponics/hoe.rsi
    storedRotation: -135
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: ent-HydroponicsToolClippers
  parent: BaseItem
  id: HydroponicsToolClippers
  description: ent-HydroponicsToolClippers.desc
  components:
  - type: Tag
    tags:
    - PlantSampleTaker
    - HydroponicsToolClippers # Einstein Engines
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 90
    damage:
      types:
        Slash: 7
  - type: Item
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    storedRotation: -90
  - type: Retractor # Shitmed: Same as wirecutters
    speed: 0.35
  - type: Hemostat
    speed: 0.6
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor2.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  # Goobstation changes
  - type: Tool
    qualities:
    - Cutting
    useSound:
      path: /Audio/Items/wirecutter.ogg
    speedModifier: 0.25

- type: entity
  name: ent-HydroponicsToolScythe
  parent: BaseItem
  id: HydroponicsToolScythe
  description: ent-HydroponicsToolScythe.desc
  components:
  - type: Sharp
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    damage:
      types:
        Slash: 10
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    slots:
    - back
  - type: StaticPrice
    price: 40
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100

- type: entity
  name: ent-HydroponicsToolHatchet
  parent: BaseItem
  id: HydroponicsToolHatchet
  description: ent-HydroponicsToolHatchet.desc
  components:
  - type: Tag
    tags:
    - BotanyHatchet
  - type: Sharp
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 8
        Piercing: 2
  - type: Item
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    storedRotation: -135
  - type: BoneSaw # Shitmed
    speed: 0.35
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/saw.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: ent-HydroponicsToolSpade
  parent: BaseItem
  id: HydroponicsToolSpade
  description: ent-HydroponicsToolSpade.desc
  components:
  - type: Tag
    tags:
    - BotanyShovel
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/spade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 8
        Piercing: 2 # I guess you can stab it into them?
    soundHit:
      collection: MetalThud
  - type: Item
    sprite: Objects/Tools/Hydroponics/spade.rsi
    storedRotation: -45
  - type: Shovel
    speedModifier: 0.75 # slower at digging than a full-sized shovel
  # Goobstation - tile digging
  - type: Tool
    qualities:
    - Digging
    speedModifier: 0.75
  - type: TileDigging
    delay: 2.5
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: ent-PlantBag
  id: PlantBag
  parent: BaseStorageItem
  description: ent-PlantBag.desc
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/Equipment/plant_bag.rsi
    state: icon
  - type: Item
    storedRotation: -90
  - type: Clothing
    quickEquip: false
    slots:
    - belt
  - type: Storage
    grid:
    - 0,0,7,4
    maxItemSize: Small
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
        - Produce
        - Seed
  - type: Dumpable
  - type: RelayInteractionStorage # Goobstation
    whitelist:
      components:
      - ProduceMaterialExtractor
